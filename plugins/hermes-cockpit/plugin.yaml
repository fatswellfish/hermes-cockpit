id: hermes-cockpit
name: Hermes Cockpit
version: 0.1.0
description: >
  项目中枢 — 把 app 内的项目、会话、任务、看板四层聚合为一个可看可操作的界面。
  只读聚合上游，不写回；任务写自有 Markdown 文件。
author: Martin
license: MIT

# 后端入口（相对于插件目录）
api: dashboard/plugin_api.py

# 桌面端入口
desktop: ../../desktop-plugins/hermes-cockpit/plugin.js

# 兼容声明：宿主版本区间，由 host_adapter.compat_status() 读取
compat: dashboard/compat.yaml

# 自有数据目录（人可直读，任何工具可读写）
data_dir: ../../

# 插件自身的健康状态（面板顶部横幅用）
health:
  - id: compat
    label: 宿主兼容性
